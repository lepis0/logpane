<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Logpane</title>
    <script>
      // Apply the persisted theme before React mounts, to avoid a
      // flash of the wrong theme. Defaults to dark when nothing is stored.
      (function () {
        try {
          var raw = localStorage.getItem("logpane-ui");
          var theme = raw ? JSON.parse(raw).state?.theme : "dark";
          document.documentElement.classList.toggle("dark", theme !== "light");
        } catch (e) {
          // localStorage unavailable or unparsable - keep the dark default.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
